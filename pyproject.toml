[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-wheel-vehicle-control-simulation"
version = "0.1.0"
description = "A configurable four-wheel vehicle dynamics and control simulation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]
test = [
    "pytest>=7.0",
]
app = [
    "matplotlib>=3.7",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
